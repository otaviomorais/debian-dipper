[Unit]
# 用 2x 大字体。
# 主要机制是 console-setup：/etc/default/console-setup 已设为 Terminus 16x32，
# 开机时 udev 在 framebuffer 控制台注册阶段就会执行
# /etc/console-setup/cached_setup_font.sh 加载
# /usr/share/consolefonts/Uni2-Terminus32x16.psf.gz（宽x高 = 16x32）。
# 这里再补一道保险：在 console-setup 之后对 /dev/tty1 显式 setfont，
# 确保登录用的那个控制台一定是大字体（字体取自 Alpine 的 font-terminus，
# 与 pmOS 控制台版同一份）。
After=getty@tty1.service
After=console-setup.service

[Service]
# Use the Debian console font when present. A missing optional font must not
# prevent the touchscreen keyboard from starting on a fresh installation.
ExecStartPre=-/usr/bin/setfont -C /dev/tty1 /usr/share/consolefonts/Uni2-Terminus32x16.psf.gz
