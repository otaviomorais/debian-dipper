# Console-only session; framebuffer/VT remains the terminal renderer.
set -g default-terminal 'tmux-256color'
set -g history-limit 10000
set -g escape-time 30
set -g mouse off
set -g set-clipboard off
setw -g mode-keys emacs
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g prefix C-a
unbind C-b
bind C-a send-prefix
bind -n F1 new-window -n Config /usr/local/bin/dipper-menu
bind -n F2 new-window -n Terminal
bind -n F3 previous-window
bind -n F4 next-window
bind -n F5 split-window -v
bind -n F6 resize-pane -Z
bind -n F7 select-pane -t :.+
bind -n F8 copy-mode
bind -n F9 command-prompt
bind -n F10 copy-mode \; send-keys -X begin-selection
bind -n F11 display-message 'Hist: localizar; Select: marcar; Copy: copiar; Paste: colar'
bind -n F12 paste-buffer -p
bind -T copy-mode F8 send-keys -X cancel
bind -T copy-mode Escape send-keys -X cancel
bind -T copy-mode F10 send-keys -X begin-selection
bind -T copy-mode F11 send-keys -X copy-selection-and-cancel
bind -T copy-mode F12 send-keys -X cancel \; paste-buffer -p
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi F10 send-keys -X begin-selection
bind -T copy-mode-vi F11 send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi F12 send-keys -X cancel \; paste-buffer -p
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-style 'bg=colour17,fg=colour255'
set -g status-left-length 38
set -g status-right-length 14
set -g status-left '#(/usr/local/bin/dipper-status) | '
set -g status-right '%d/%m %H:%M'
setw -g window-status-current-style 'bg=colour24,fg=colour255,bold'
set -g display-time 3000
set -g display-panes-time 2000
