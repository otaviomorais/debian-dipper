# Mi 8: four 32-pixel console lines keep the notch out of the session.
# The fifth line is the real status bar; tmux panes start below it.
set -g status 5
set -g status-format[0] ''
set -g status-format[1] ''
set -g status-format[2] ''
set -g status-format[3] ''
set -g status-format[4] '#[align=left]#{T:status-left}#[list=on align=centre]#{W:#[fg=colour250] #I:#W ,#[fg=colour117 bold] #I:#W }#[nolist align=right]#{T:status-right}'
